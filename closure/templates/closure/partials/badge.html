<span class="inline-flex items-center rounded-full px-2 py-1 text-xs font-medium
{% if value == 'closed' or value == 'passed' or value == 'active' %}bg-green-100 text-green-800
{% elif value == 'failed' or value == 'fail' %}bg-red-100 text-red-800
{% elif value == 'partial' or value == 'medium' or value == 'high' %}bg-yellow-100 text-yellow-800
{% elif value == 'critical' %}bg-red-100 text-red-800
{% else %}bg-gray-100 text-gray-800{% endif %}">
  {{ value|default:"unknown" }}
</span>
