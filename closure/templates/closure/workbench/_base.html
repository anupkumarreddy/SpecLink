{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SpecLink Workbench{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui'],
            mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'monospace'],
          },
          colors: {
            accent: {
              50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe', 300: '#a5b4fc',
              400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca',
              800: '#3730a3', 900: '#312e81',
            },
          },
          boxShadow: {
            soft: '0 1px 2px 0 rgba(15, 23, 42, 0.04), 0 1px 3px 0 rgba(15, 23, 42, 0.05)',
            lift: '0 6px 16px -6px rgba(15, 23, 42, 0.08), 0 2px 4px -2px rgba(15, 23, 42, 0.04)',
            focus: '0 0 0 3px rgba(79, 70, 229, 0.18)',
            'inner-ring': 'inset 0 0 0 1px rgba(15, 23, 42, 0.06)',
          },
          animation: {
            'fade-in': 'fadeIn 180ms ease-out',
            'slide-up': 'slideUp 200ms ease-out',
            'slide-left': 'slideLeft 220ms ease-out',
          },
          keyframes: {
            fadeIn: { '0%': { opacity: 0 }, '100%': { opacity: 1 } },
            slideUp: { '0%': { opacity: 0, transform: 'translateY(4px)' }, '100%': { opacity: 1, transform: 'translateY(0)' } },
            slideLeft: { '0%': { opacity: 0, transform: 'translateX(8px)' }, '100%': { opacity: 1, transform: 'translateX(0)' } },
          },
        },
      },
    };
  </script>
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

    /* Subtle refined scrollbar */
    *::-webkit-scrollbar { width: 10px; height: 10px; }
    *::-webkit-scrollbar-track { background: transparent; }
    *::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.35); border: 2px solid transparent; background-clip: content-box; border-radius: 8px; }
    *::-webkit-scrollbar-thumb:hover { background: rgba(100, 116, 139, 0.55); background-clip: content-box; }

    /* Default smooth transitions on interactive elements */
    button, a, input, select, textarea { transition: background-color 150ms ease, color 150ms ease, border-color 150ms ease, box-shadow 150ms ease; }

    /* Tighter caret style */
    [type=text], [type=number], [type=email], [type=url], [type=search], [type=password], textarea, select {
      caret-color: rgb(79 70 229);
    }
    /* Selection color */
    ::selection { background: rgba(99, 102, 241, 0.2); }

    /* HTMX swap fade-in for the detail + inspector + tree refresh */
    #wb-detail, #wb-inspector, #wb-tree, #wb-drawer { animation: fadeIn 180ms ease-out; }

    /* Subtle background pattern on the center pane */
    .wb-canvas {
      background-image: radial-gradient(circle at 1px 1px, rgba(15,23,42,0.04) 1px, transparent 0);
      background-size: 22px 22px;
    }
  </style>
</head>
<body class="h-screen overflow-hidden bg-slate-50 font-sans text-slate-800">
  {% if messages %}
    <div class="pointer-events-none fixed right-4 top-14 z-50 w-80 space-y-2">
      {% for message in messages %}
        <div class="pointer-events-auto rounded-xl border border-accent-100 bg-white px-4 py-3 text-sm text-slate-700 shadow-lift">
          <span class="font-medium text-accent-700">{{ message }}</span>
        </div>
      {% endfor %}
    </div>
  {% endif %}
  {% block content %}{% endblock %}
</body>
</html>
