{% if not nodes %}
  <li class="px-3 py-1 text-[11px] italic text-slate-400" style="padding-left: {% widthratio depth 1 14 %}px">Empty</li>
{% else %}
  {% for node in nodes %}
    {% include "closure/workbench/_tree_node.html" with node=node depth=depth link_qs=link_qs %}
  {% endfor %}
{% endif %}
